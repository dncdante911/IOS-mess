name: iOS unsigned IPA

# Собирает НЕПОДПИСАННЫЙ .ipa на macOS-раннере GitHub.
#
# Почему неподписанный: подпись требует Apple Developer Program (99 $/год).
# Пока подписки нет, .ipa подписывается уже на твоей стороне — Sideloadly или
# AltStore делают это на Windows бесплатным Apple ID. Схема рабочая, просто
# профиль живёт 7 дней и раз в неделю нужен повторный «refresh».
#
# Запуск: вкладка Actions → «iOS unsigned IPA» → Run workflow.
# Результат: артефакт worldmates-ios-unsigned.ipa, скачивается со страницы прогона.

on:
  workflow_dispatch:      # запуск руками — по умолчанию, чтобы не жечь минуты
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'app.json'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    # macOS-раннер обязателен: тулчейн Apple (clang для arm64-apple-ios, actool,
    # xcodebuild) существует только под macOS. На ubuntu собрать iOS нельзя.
    #
    # ⚠️ Минуты macOS тарифицируются с множителем x10. Для приватного репозитория
    # 2000 бесплатных минут в месяц превращаются в ~200 минут сборок iOS —
    # примерно 8–12 прогонов. Для публичного репозитория — бесплатно без лимита.
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci, а не npm install: ставит строго по package-lock.json и сначала
      # удаляет node_modules, если он вдруг оказался в репозитории. Именно это
      # и защищает от «Permission denied» на .bin/expo — файлы, пришедшие из
      # git без бита исполняемости, заменяются нормально установленными.
      - name: Установка зависимостей
        run: npm ci --legacy-peer-deps

      # Подстраховка на случай, если .bin приехал без прав (бывает, когда
      # репозиторий создавался на Windows). Стоит копейки, экономит час поисков.
      - name: Права на бинарники
        run: chmod -R +x node_modules/.bin || true

      # Генерирует папку ios/ из app.json. В репозитории её нет и быть не должно:
      # это производный артефакт, который Expo пересоздаёт под текущие плагины.
      - name: Expo prebuild
        run: npx expo prebuild --platform ios --no-install --clean

      - name: CocoaPods
        working-directory: ios
        run: pod install --repo-update

      # Имя схемы Xcode Expo делает из app.json → expo.name, убирая пробелы:
      # "WorldMates Messenger" → WorldMatesMessenger. Определяем автоматически,
      # чтобы переименование приложения не ломало сборку.
      - name: Определить схему
        id: scheme
        working-directory: ios
        run: |
          # ВАЖНО: .xcworkspace — это папка-бандл, а не файл. Без -d команда ls
          # печатает её СОДЕРЖИМОЕ (contents.xcworkspacedata), и в xcodebuild
          # уезжает несуществующее имя. -d заставляет вывести саму папку.
          WORKSPACE=$(ls -1d *.xcworkspace 2>/dev/null | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ .xcworkspace не найден — expo prebuild или pod install не отработали"
            ls -la
            exit 1
          fi
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Воркспейс: $WORKSPACE"
          echo "Схема: $SCHEME"
          # Показываем реальный список схем — если сборка потом упадёт на схеме,
          # в логе сразу видно, из чего можно было выбирать.
          xcodebuild -workspace "$WORKSPACE" -list || true

      # Ключевая часть: CODE_SIGNING_ALLOWED=NO отключает подпись целиком.
      # Без этого xcodebuild потребует сертификат и упадёт.
      - name: Сборка без подписи
        working-directory: ios
        run: |
          # pipefail обязателен: без него код возврата берётся от последней
          # команды в пайпе (xcpretty), и упавшая сборка выглядела бы успешной.
          set -o pipefail

          build() {
            xcodebuild \
              -workspace "${{ steps.scheme.outputs.workspace }}" \
              -scheme "${{ steps.scheme.outputs.name }}" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=NO \
              "$@"
          }

          # Полный лог всегда пишется в файл, даже когда на экран идёт
          # причёсанный xcpretty. Это принципиально: xcpretty СКРЫВАЕТ вывод
          # скриптовых фаз, а «Bundle React Native code and images» — это
          # запуск Metro, и настоящая причина падения (нерезолвнутый модуль,
          # синтаксическая ошибка, нехватка памяти) печатается именно там.
          # Без сырого лога видны только предупреждения компилятора.
          RAW_LOG=../xcodebuild-raw.log

          if command -v xcpretty >/dev/null 2>&1; then
            build 2>&1 | tee "$RAW_LOG" | xcpretty || BUILD_FAILED=1
          else
            echo "xcpretty не найден — собираем с полным логом"
            build 2>&1 | tee "$RAW_LOG" || BUILD_FAILED=1
          fi

          if [ -n "$BUILD_FAILED" ]; then
            echo "::group::❌ Ошибки Metro и скриптовых фаз"
            grep -nE "Unable to resolve|Cannot find module|SyntaxError|error:|Error:|nonzero exit code|Command PhaseScriptExecution failed" "$RAW_LOG" \
              | grep -viE "nullability|duplicate librar|will be run during every build" \
              | tail -60
            echo "::endgroup::"

            echo "::group::Последние 250 строк полного лога"
            tail -250 "$RAW_LOG"
            echo "::endgroup::"
            exit 1
          fi

      # Сырой лог выгружается всегда — и при успехе, и при падении: разбирать
      # 13 000 строк удобнее в файле, чем в веб-интерфейсе Actions.
      - name: Выгрузить лог сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild-raw.log
          retention-days: 7
          if-no-files-found: ignore

      # .ipa — это обычный zip с папкой Payload внутри. xcodebuild archive +
      # exportArchive здесь не подходят: экспорт требует подписи, а нам нужен
      # именно неподписанный бинарь.
      - name: Упаковать в .ipa
        working-directory: ios
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then echo "❌ .app не найден"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr worldmates-ios-unsigned.ipa Payload
          ls -lh worldmates-ios-unsigned.ipa

      - name: Выгрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: worldmates-ios-unsigned
          path: ios/worldmates-ios-unsigned.ipa
          retention-days: 30
